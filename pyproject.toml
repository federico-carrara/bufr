[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "bufr"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "scipy",
    "scikit-image",
    "opencv-python",
    "matplotlib",
    "Pillow",
    "tabulate",
    "pyyaml",
    "wilds",
    "wandb",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lib*", "data*"]
